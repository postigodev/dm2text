<main>

    <div

      style="display: flex; flex-direction: column-reverse; overflow-y: scroll"
    >
      <div>
        <div role="row" aria-label="Message" data-fixture-message="original">
          <span aria-label="Sender">Person A</span>
          <div dir="auto">message-one</div>
          <div aria-label="Message actions">
            <div role="button" aria-label="React"></div>
            <div role="button" aria-label="Reply"></div>
            <div role="button" aria-label="More"></div>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>
<template id="native-menu-template">
  <div role="dialog">
    <div>
      <button type="button">Native action one</button>
      <button type="button">Native action two</button>
    </div>
  </div>
</template>
